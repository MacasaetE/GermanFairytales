<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>History</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />

    <link href="styles.css" rel="stylesheet" />
    <link href="history.css" rel="stylesheet" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />

    <script src="navigation.js" defer></script>
    <script src="darkmode.js" defer></script>
  </head>

  <body>
    <!--Header-->
    <my-header></my-header>
    <main>
      <section class="history-hero">
        <div class="history-hero-left">
          <h1 class="history-title">
            <span>H</span><span>i</span><span>s</span><span>t</span
            ><span>o</span><span>r</span><span>y</span>
          </h1>

          <div class="text">
            <h2>Grimm's to Gryffindor</h2>
            <p>
              Many of the fairy tales we grew up with originate from the Grimm
              Brother's collection of fairy tales.
            </p>
          </div>
        </div>
      </section>
      <section class="history-cards">
        <div class="card card-black">
          <div class="card-img">
            <img
              src="images/Cinderella_Kubel.jpg"
              alt="Cinderella holding an empty bowl, "
            />
          </div>

          <div class="card-body">
            Beauty has remained a consistent theme in fairy tales throughout
            history.
          </div>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
